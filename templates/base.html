<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Mini DoorDash{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header class="topbar"><a class="brand" href="{{ url_for('index') }}"><span class="brand-mark">M</span> Mini DoorDash</a><nav><a href="{{ url_for('index') }}">Nhà hàng</a><a href="{{ url_for('orders') }}">Đơn hàng</a></nav></header>
  <main class="container">
    {% with messages = get_flashed_messages(with_categories=true) %}{% if messages %}<div class="notices">{% for category, message in messages %}<div class="notice {{ category }}">{{ message }}</div>{% endfor %}</div>{% endif %}{% endwith %}
    {% block content %}{% endblock %}
  </main>
  <footer>Phase 4 · Flask + MySQL · Demo cơ sở dữ liệu Mini DoorDash</footer>
</body>
</html>
